<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Open book -->
    <path d="M-120,-60 L-120,80 Q-120,100 -100,100 L-20,100 L-20,-40 Q-20,-60 -40,-60 Z" fill="white" opacity="0.95"/>
    <path d="M120,-60 L120,80 Q120,100 100,100 L20,100 L20,-40 Q20,-60 40,-60 Z" fill="white" opacity="0.85"/>
    <!-- Book spine -->
    <rect x="-8" y="-60" width="16" height="160" rx="4" fill="white" opacity="0.7"/>
    <!-- AI nodes -->
    <circle cx="-70" cy="-20" r="8" fill="#7c3aed" opacity="0.8"/>
    <circle cx="70" cy="-20" r="8" fill="#7c3aed" opacity="0.8"/>
    <circle cx="-70" cy="40" r="6" fill="#7c3aed" opacity="0.6"/>
    <circle cx="70" cy="40" r="6" fill="#7c3aed" opacity="0.6"/>
    <circle cx="0" cy="-90" r="10" fill="white" opacity="0.9"/>
    <!-- Connection lines -->
    <line x1="0" y1="-90" x2="-70" y2="-20" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-90" x2="70" y2="-20" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="-70" y1="-20" x2="-70" y2="40" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="70" y1="-20" x2="70" y2="40" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="-70" y1="-20" x2="70" y2="-20" stroke="white" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
