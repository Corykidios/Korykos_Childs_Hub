[project]
name = "duckduckgoose-backend"
version = "0.1.0"
description = "DuckDuckGoose: corpus-seeded multi-agent social simulation (supervisor backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "chromadb>=1.0",
    "openai>=1.40",
    "requests>=2.31",
    "camel-oasis==0.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
